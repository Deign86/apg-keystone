name: Keystone

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: keystone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generated theme matches shared/design/tokens.json
        run: npm run sync -- --check
      - run: npm run typecheck
      - run: npm test
      - name: Taste Skill lint (app rules)
        run: node .claude/skills/taste-skill/scripts/lint.mjs --app apps/keystone/src packages/ui/src
      - name: Linux libraries for the Tauri shell
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/keystone/src-tauri
      - name: Rust tests
        run: cargo test --manifest-path apps/keystone/src-tauri/Cargo.toml

  desktop:
    name: Desktop app (${{ matrix.name }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundle: apps/keystone/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows
            os: windows-latest
            args: --bundles nsis
            targets: ''
            bundle: apps/keystone/src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/keystone/src-tauri
      - name: Build Keystone
        working-directory: apps/keystone
        run: npx tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: Keystone-${{ matrix.name }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error
