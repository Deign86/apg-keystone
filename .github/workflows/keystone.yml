name: Keystone

on:
  # Not on other branch pushes: a branch is checked by its pull request, so the checks are still pending when the
  # pull request opens and auto-merge can be turned on (GitHub refuses it once they have passed).
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Run workflow on GitHub's Actions tab. Given a version, the run releases the chosen branch's commit as v<version>.
  workflow_dispatch:
    inputs:
      release:
        description: Version to release, like 0.2.0 (creates the tag v0.2.0). Leave empty for a plain run.
        required: false
        default: ''
  # A release made on GitHub's Releases page. A tag pushed from git (v1.2.3) arrives as a push. Either way the
  # release job below attaches both installers; both events share the tag's concurrency group, so one run finishes.
  release:
    types: [published]

concurrency:
  group: keystone-${{ github.ref }}-${{ inputs.release }}
  cancel-in-progress: true

jobs:
  # Which release this run makes, if any (README › Making a release):
  # - a v… tag pushed or published, or the version asked for with Run workflow;
  # - on a push to main, automatically, from the commit subjects since the last v… tag: a feat makes the next minor
  #   version (0.1.2 → 0.2.0), a fix or perf the next patch (0.1.2 → 0.1.3); docs, test, ci, chore, refactor, style
  #   and build release nothing. Merges that land together go out as one release.
  # Empty otherwise. The installers and the release are built only after the checks pass.
  version:
    name: Version
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          fetch-depth: 0
      - id: next
        name: Decide the release
        env:
          REQUESTED: ${{ inputs.release }}
        run: |
          tag=''
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ -n "$REQUESTED" ]]; then
            tag="v${REQUESTED#v}"
          elif [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || true)
            subjects=$(git log --no-merges --format=%s "${last:+$last..}HEAD")
            IFS=. read -r major minor patch <<< "${last#v}"
            major=${major:-0} minor=${minor:-0} patch=${patch:-0}
            if grep -qE '^feat(\([^)]*\))?!?:' <<< "$subjects"; then
              tag="v$major.$((minor + 1)).0"
            elif grep -qE '^(fix|perf)(\([^)]*\))?!?:' <<< "$subjects"; then
              tag="v$major.$minor.$((patch + 1))"
            fi
            echo "Since ${last:-the first commit}:"
            echo "$subjects" | sed 's/^/  /'
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release: ${tag:-none}" | tee -a "$GITHUB_STEP_SUMMARY"

  checks:
    name: Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generated files (theme, assets, seed) match shared/
        run: npm run sync -- --check
      - name: Package boundaries (parts depend only on core, ui and kit; every import declared)
        run: npm run check:boundaries
      - name: Agent skills load (every .agents/skills skill linked from .claude/skills)
        run: npm run check:skills
      - name: Every installed module and connector has its own end-to-end tests
        run: npm run check:e2e
      - name: Oxlint with the anti-slop rules
        run: npm run lint
      - run: npm run typecheck
      - name: Every package's tests, plus the removal, contract and service suites
        run: npm test
      - name: Chromium for the end-to-end tests
        run: npx @e2e-dev/web install chromium --with-deps
      - name: End-to-end tests (every screen and its flows in Chromium, against the dev server)
        run: npm run test:e2e
      - name: Keep the end-to-end traces and screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: .e2e/
          include-hidden-files: true  # .e2e/ itself is a hidden folder, which upload-artifact skips by default
          if-no-files-found: ignore
          retention-days: 14
      - name: Taste Skill lint (app rules)
        run: npm run lint:taste
      - name: Linux libraries for the Tauri shell
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/keystone/src-tauri
      - name: Rust tests
        run: cargo test --manifest-path apps/keystone/src-tauri/Cargo.toml

  desktop:
    name: Desktop app (${{ matrix.name }})
    needs: [checks, version]
    env:
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundle: apps/keystone/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            updater: apps/keystone/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz*
          - name: Windows
            os: windows-latest
            args: --bundles nsis
            targets: ''
            bundle: apps/keystone/src-tauri/target/release/bundle/nsis/*.exe
            updater: apps/keystone/src-tauri/target/release/bundle/nsis/*.exe.sig
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/keystone/src-tauri
      # A release also builds the signed update files installed copies update from (the macOS app as .app.tar.gz,
      # a .sig beside each), when the TAURI_SIGNING_PRIVATE_KEY secret is set. Other builds skip them, so they never
      # need the key.
      - name: Stamp the release's version (v1.2.3 → 1.2.3) on the app and its installers
        if: env.RELEASE_TAG != ''
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          node -e '
            const fs = require("fs"), file = "apps/keystone/src-tauri/tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(file, "utf8"));
            conf.version = process.env.RELEASE_TAG.slice(1);
            conf.bundle.createUpdaterArtifacts = Boolean(process.env.TAURI_SIGNING_PRIVATE_KEY);
            fs.writeFileSync(file, JSON.stringify(conf, null, 2) + "\n");
          '
      - name: Build Keystone
        working-directory: apps/keystone
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: Keystone-${{ matrix.name }}
          path: |
            ${{ matrix.bundle }}
            ${{ matrix.updater }}
          if-no-files-found: error

  release:
    name: Release
    needs: [desktop, version]
    if: needs.version.outputs.tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts
            apps/keystone/src-tauri/tauri.conf.json
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      # latest.json is what installed copies read to update themselves (plugins.updater in tauri.conf.json). The script
      # checks every update file against the app's public key first, so a release they would refuse fails here.
      - name: Write the update manifest, after verifying every signature
        run: |
          find installers -mindepth 2 -type f -exec mv -t installers {} +
          find installers -mindepth 1 -type d -empty -delete
          code=0
          node scripts/updater-manifest.mjs installers "$RELEASE_TAG" "$GITHUB_REPOSITORY" || code=$?
          if [ "$code" = 2 ]; then
            echo "::warning title=No updates in this release::TAURI_SIGNING_PRIVATE_KEY is not set, so installed copies cannot update to $RELEASE_TAG by themselves (README › Making a release)."
          elif [ "$code" != 0 ]; then
            exit "$code"
          fi
          ls -l installers
      - name: Publish the macOS and Windows installers on the release
        run: |
          # A new release starts as a draft and is published once both installers are on it, so a run stopped halfway
          # never leaves a release without them (a draft has no tag yet, so the next run picks the same version).
          if ! gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" --title "Keystone ${RELEASE_TAG#v}" --generate-notes --notes "$(cat <<'NOTES'
          ## Install

          - **macOS** (Apple silicon and Intel, macOS 11 or later): download the `.dmg`, open it and drag Keystone to
            Applications. Keystone is not notarized by Apple, so the first time you open it macOS refuses: choose
            *Done*, then *System Settings › Privacy & Security › Open Anyway*. If macOS says the app "is damaged",
            run `xattr -dr com.apple.quarantine /Applications/Keystone.app` in Terminal and open it again.
          - **Windows** (10 or 11): run the `-setup.exe`. It installs for the current user. If SmartScreen asks,
            choose *More info › Run anyway*.
          NOTES
          )"
          fi
          gh release upload "$RELEASE_TAG" installers/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
