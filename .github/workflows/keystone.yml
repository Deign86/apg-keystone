name: Keystone

on:
  # Not on other branch pushes: a branch is checked by its pull request, so the checks are still pending when the
  # pull request opens and auto-merge can be turned on (GitHub refuses it once they have passed).
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  # A release made on GitHub's Releases page. A tag pushed from git (v1.2.3) arrives as a push. Either way the
  # release job below attaches both installers; both events share the tag's concurrency group, so one run finishes.
  release:
    types: [published]

concurrency:
  group: keystone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generated files (theme, assets, seed) match shared/
        run: npm run sync -- --check
      - name: Package boundaries (parts depend only on core, ui and kit; every import declared)
        run: npm run check:boundaries
      - name: Agent skills load (every .agents/skills skill linked from .claude/skills)
        run: npm run check:skills
      - name: Oxlint with the anti-slop rules
        run: npm run lint
      - run: npm run typecheck
      - name: Every package's tests, plus the removal, contract and service suites
        run: npm test
      - name: Chromium for the end-to-end tests
        run: npx @e2e-dev/web install chromium --with-deps
      - name: End-to-end tests (every screen in Chromium, against the dev server)
        run: npm run test:e2e
      - name: Taste Skill lint (app rules)
        run: npm run lint:taste
      - name: Linux libraries for the Tauri shell
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/keystone/src-tauri
      - name: Rust tests
        run: cargo test --manifest-path apps/keystone/src-tauri/Cargo.toml

  desktop:
    name: Desktop app (${{ matrix.name }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundle: apps/keystone/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows
            os: windows-latest
            args: --bundles nsis
            targets: ''
            bundle: apps/keystone/src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/keystone/src-tauri
      - name: Stamp the release's version (tag v1.2.3 → 1.2.3) on the app and its installers
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          node -e '
            const fs = require("fs"), file = "apps/keystone/src-tauri/tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(file, "utf8"));
            conf.version = process.env.GITHUB_REF_NAME.slice(1);
            fs.writeFileSync(file, JSON.stringify(conf, null, 2) + "\n");
          '
      - name: Build Keystone
        working-directory: apps/keystone
        run: npx tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: Keystone-${{ matrix.name }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error

  release:
    name: Release
    needs: desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true
      - name: Publish the macOS and Windows installers on the release
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --title "Keystone ${TAG#v}" --generate-notes --notes "$(cat <<'NOTES'
          ## Install

          - **macOS** (Apple silicon and Intel, macOS 11 or later): download the `.dmg`, open it and drag Keystone to
            Applications. Keystone is not notarized by Apple, so the first time you open it macOS refuses: choose
            *Done*, then *System Settings › Privacy & Security › Open Anyway*. If macOS says the app "is damaged",
            run `xattr -dr com.apple.quarantine /Applications/Keystone.app` in Terminal and open it again.
          - **Windows** (10 or 11): run the `-setup.exe`. It installs for the current user. If SmartScreen asks,
            choose *More info › Run anyway*.
          NOTES
          )"
          fi
          gh release upload "$TAG" installers/* --clobber
