name: Keystone

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: keystone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generated files (theme, assets, seed) match shared/
        run: npm run sync -- --check
      - name: Package boundaries (parts depend only on core, ui and kit; every import declared)
        run: npm run check:boundaries
      - name: Agent skills load (every .agents/skills skill linked from .claude/skills)
        run: npm run check:skills
      - name: Oxlint with the anti-slop rules
        run: npm run lint
      - run: npm run typecheck
      - name: Every package's tests, plus the removal, contract and service suites
        run: npm test
      - name: Chromium for the end-to-end tests
        run: npx @e2e-dev/web install chromium --with-deps
      - name: End-to-end tests (every screen in Chromium, against the dev server)
        run: npm run test:e2e
      - name: Taste Skill lint (app rules)
        run: npm run lint:taste
      - name: Linux libraries for the Tauri shell
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/keystone/src-tauri
      - name: Rust tests
        run: cargo test --manifest-path apps/keystone/src-tauri/Cargo.toml

  desktop:
    name: Desktop app (${{ matrix.name }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin --bundles app,dmg
            targets: aarch64-apple-darwin,x86_64-apple-darwin
            bundle: apps/keystone/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          - name: Windows
            os: windows-latest
            args: --bundles nsis
            targets: ''
            bundle: apps/keystone/src-tauri/target/release/bundle/nsis/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/keystone/src-tauri
      - name: Build Keystone
        working-directory: apps/keystone
        run: npx tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: Keystone-${{ matrix.name }}
          path: ${{ matrix.bundle }}
          if-no-files-found: error
